<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ea">
  <title>All Exhibits · Knowledge Museum</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/app-icon-1024.png">
  <link rel="stylesheet" href="assets/css/app.css?v=20261005-5">
</head>
<body data-page="archive">
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html">KNOWLEDGE MUSEUM<small>PERSONAL ARCHIVE</small></a>
      <div class="top-actions"><a class="icon-btn" href="index.html">← 大厅</a><button class="icon-btn" id="randomBtn">随机漫游 ↗</button></div>
    </header>
    <main>
      <section class="collection-hero">
        <div class="kicker">All Collections</div>
        <h1>全部馆藏</h1>
        <p>在这里查看所有展品，并按分类或关键词筛选。</p>
        <div class="collection-count" id="archiveCount"></div>
      </section>
      <section class="section compact-section">
        <div class="browse-toolbar archive-toolbar">
          <div class="controls archive-controls">
            <input class="search" id="archiveSearch" placeholder="搜索标题、标签或关键词…">
            <div class="chip-row" id="archiveFilters"></div>
          </div>
          <div class="view-toggle" aria-label="切换展示方式">
  <button class="view-btn active" data-view="gallery" title="Gallery">▦ <span>Gallery</span></button>
  <button class="view-btn" data-view="list" title="List">☰ <span>List</span></button>
</div>
        </div>
        <div class="exhibit-view gallery-view" id="archiveList"></div>
      </section>
    </main>
    <footer>KNOWLEDGE MUSEUM · Full Archive</footer>
  </div>
  <script src="assets/js/app.js?v=20261005-5"></script>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
    }
  </script>
</body>
</html>
