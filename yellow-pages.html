<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>知识坐标 · Knowledge Atlas | Knowledge Museum</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<script src="assets/js/theme.js"></script>
<style>
:root{--bg:#f6f5f1;--paper:#fff;--ink:#152d34;--muted:#627278;--soft:#8a9a98;--line:#e3e8e6;--line2:#d3dfdc;--teal:#087e76;--teal-ink:#0b6d67;--teal-soft:#e5f5ef;--gold:#e9a25c;--pink:#c45f8f;--shadow:0 14px 40px #203c3a14;--shadow-s:0 4px 16px #203c3a0d;
 --fs-body:clamp(15px,.35vw + 13.6px,17px);--fs-title:clamp(16.5px,.4vw + 15px,19px);--radius:20px;--safe-b:env(safe-area-inset-bottom,0px)}
[data-theme="dark"]{color-scheme:dark;--bg:#111816;--paper:#18211f;--ink:#e3ece9;--muted:#9aaba8;--soft:#788a87;--line:#26322f;--line2:#33433f;--teal:#3fb5a8;--teal-ink:#7fd3c8;--teal-soft:#16302b;--gold:#e0a463;--pink:#e08ab3;--shadow:0 14px 40px #0006;--shadow-s:0 4px 16px #0004}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft Yahei",sans-serif;font-size:var(--fs-body);line-height:1.6;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.shell{max-width:1260px;margin:auto;padding:0 max(clamp(16px,4vw,48px),env(safe-area-inset-right)) calc(90px + var(--safe-b)) max(clamp(16px,4vw,48px),env(safe-area-inset-left))}

/* top bar */
.topbar{min-height:70px;padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line2)}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:12px;font-weight:700;letter-spacing:.16em;line-height:1.3}
.brand small{display:block;font:10px/1.4 -apple-system,sans-serif;letter-spacing:.1em;color:var(--muted);margin-top:4px}
.top-controls{display:flex;align-items:center;gap:8px}
.pill-btn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 15px;border:1px solid var(--line2);border-radius:99px;background:var(--paper);font-size:13px;font-weight:700;white-space:nowrap}
.pill-btn:hover{border-color:var(--teal)}
.km-theme-toggle{min-height:44px;min-width:44px;border:1px solid var(--line2);border-radius:99px;background:var(--paper);font-size:16px}
.language-switch{display:inline-flex;padding:3px;border:1px solid var(--line2);border-radius:99px;background:var(--teal-soft)}
.language-switch button{min-width:40px;min-height:38px;border:0;border-radius:99px;background:transparent;color:var(--teal-ink);font-size:12px;font-weight:800}
.language-switch button.active{background:var(--teal);color:#fff}
@media(max-width:620px){
 .topbar{flex-wrap:wrap;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px}
 .brand{flex:1 1 auto}
 .top-controls{width:100%;justify-content:space-between}
 .back-label{display:none}
}

/* header */
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px;padding:clamp(22px,4vw,40px) 0 clamp(14px,2.4vw,24px)}
.kicker{display:flex;align-items:center;gap:10px;color:var(--teal);text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:.15em}
.kicker:before{content:"";width:22px;height:2px;background:var(--gold)}
h1{font-size:clamp(27px,3.4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.2;margin:12px 0 10px}
h1 [data-t="heroB"]{background:linear-gradient(94deg,#07867d 0%,#1478b4 52%,#bb72a9 100%);color:transparent;-webkit-background-clip:text;background-clip:text}
[data-theme="dark"] h1 [data-t="heroB"]{background-image:linear-gradient(94deg,#4cc3b5 0%,#6aaee0 52%,#e09ac9 100%)}
.intro p{margin:0;color:var(--muted);max-width:560px;font-size:clamp(14px,.3vw + 13px,16px)}
.orbit{width:clamp(96px,12vw,150px);height:auto;filter:drop-shadow(0 10px 18px #2e726522)}
.orbit .ring{transform-origin:center;animation:spin 85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.orbit .ring{animation:none}}
@media(max-width:620px){.orbit{display:none}.intro{grid-template-columns:1fr}}

/* sticky bar: tabs + search */
.bar{position:sticky;top:0;z-index:30;margin:0 calc(-1 * clamp(16px,4vw,48px));padding:10px clamp(16px,4vw,48px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;display:flex;gap:12px;align-items:center}
.bar.stuck{border-bottom-color:var(--line)}
.tabs{display:inline-flex;padding:4px;border-radius:99px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow-s);flex:0 0 auto}
.tab{min-height:42px;padding:0 18px;border:0;border-radius:99px;background:transparent;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab.active{background:var(--teal);color:#fff}
.tab b{font-weight:700;opacity:.75;margin-left:3px;font-size:12px}
.search{flex:1 1 auto;display:flex;align-items:center;gap:8px;min-width:0;height:52px;padding:0 8px 0 16px;border-radius:99px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow-s)}
.search:focus-within{border-color:var(--teal)}
.search svg{width:20px;flex:none;stroke:var(--teal)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;height:100%}
.search input::placeholder{color:var(--soft)}
.clear{min-height:36px;border:0;border-radius:99px;background:var(--teal-soft);color:var(--teal-ink);font-size:12px;font-weight:700;padding:0 12px}
@media(max-width:760px){.bar{flex-wrap:wrap;gap:8px}.tabs{width:100%}.tab{flex:1;padding:0 8px}.search{height:48px}}

/* feed */
.feed-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 14px;flex-wrap:wrap}
.feed-head h2,.dir-head h2{font-size:clamp(18px,1.4vw + 12px,22px);margin:0;letter-spacing:-.01em}
.feed-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.feed-tools{display:flex;gap:8px;align-items:center}
.select{min-height:44px;border:1px solid var(--line2);border-radius:99px;background:var(--paper);padding:0 34px 0 14px;font-size:13px;font-weight:600;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;max-width:52vw}
.feed{display:flex;gap:clamp(14px,1.6vw,22px);align-items:flex-start}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:clamp(14px,1.6vw,22px)}
.card{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-s);transition:transform .2s,box-shadow .2s,opacity .25s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card.is-seen{opacity:.86}
.thumb{position:relative;aspect-ratio:16/9;background:var(--tint,#e5f5ef);overflow:hidden;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.thumb.band{aspect-ratio:auto;height:62px}
.ph{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:0 18px;background:linear-gradient(120deg,var(--tint,#e5f5ef),var(--tint2,#b4e9d9))}
.ph:after{content:"";position:absolute;right:-18px;top:-26px;width:96px;height:96px;border-radius:44% 56% 62% 38%;background:var(--tint2,#b4e9d9);opacity:.8}
.ph .glyph{position:relative;z-index:1;font-size:22px;line-height:1;color:#1d4a45}
.ph .dom{position:relative;z-index:1;font:700 15px/1.2 Georgia,serif;color:#1d3d3a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
[data-theme="dark"] .ph{filter:brightness(.62) saturate(.9)}
[data-theme="dark"] .thumb img{filter:brightness(.9)}
.badge{position:absolute;right:12px;top:12px;z-index:2;font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:#ffffffe6;color:#2f4b48}
.badge.dead{background:#fde8e8;color:#a33}
.body{display:flex;flex-direction:column;gap:6px;padding:15px 18px 6px;flex:1}
.meta{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--teal);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3{margin:0;font-size:var(--fs-title);line-height:1.38;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card h3 a::after{content:"";position:absolute;inset:0;z-index:0}
.desc{margin:0;color:var(--muted);font-size:14px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.desc.ai:before{content:attr(data-ai);font-size:10px;font-weight:800;color:var(--soft);border:1px solid var(--line2);border-radius:5px;padding:0 4px;margin-right:6px;vertical-align:1px}
.foot{display:flex;align-items:center;gap:6px;padding:6px 10px 12px 18px;position:relative;z-index:1}
.domain{flex:1;min-width:0;font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{min-width:44px;min-height:44px;border:0;border-radius:99px;background:transparent;font-size:18px;color:var(--soft);display:inline-grid;place-items:center}
.icon:hover{background:var(--teal-soft);color:var(--teal-ink)}
.icon.liked{color:var(--pink)}
.card.gone{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;min-height:0;color:var(--muted);font-size:13px;box-shadow:none;background:transparent;border-style:dashed}
.card.gone:hover{transform:none}
.undo{min-height:40px;border:1px solid var(--line2);border-radius:99px;background:var(--paper);padding:0 14px;font-size:13px;font-weight:700}
.sentinel{height:1px}
.end{text-align:center;color:var(--muted);padding:34px 0 10px;font-size:14px}
.end button{margin-top:10px}

/* directory */
.dir-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.dir-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 0 8px;margin:0 calc(-1 * clamp(16px,4vw,48px));padding-left:clamp(16px,4vw,48px);padding-right:clamp(16px,4vw,48px)}
.chips::-webkit-scrollbar{display:none}
@media(min-width:900px){.chips{flex-wrap:wrap;overflow:visible;margin:0;padding-left:0;padding-right:0}}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:99px;background:var(--paper);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip small{opacity:.6;margin-left:4px;font-size:11px}
.chip.active{background:var(--teal);border-color:var(--teal);color:#fff}
.chips.sub .chip{min-height:36px;font-size:12px;background:transparent}
.chips.sub .chip.active{background:var(--teal-soft);color:var(--teal-ink);border-color:var(--teal)}
.list{display:grid;gap:10px;margin-top:8px}
@media(min-width:900px){.list{grid-template-columns:1fr 1fr}}
.row{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 8px 12px 12px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.row:hover{border-color:var(--teal)}
.mini{width:64px;height:48px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,var(--tint,#e5f5ef),var(--tint2,#b4e9d9));display:grid;place-items:center;font-size:20px;color:#1d4a45}
.mini img{width:100%;height:100%;object-fit:cover;object-position:top}
[data-theme="dark"] .mini{filter:brightness(.8)}
.row h3{margin:0;font-size:15.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row h3 a::after{content:"";position:absolute;inset:0}
.row .desc{-webkit-line-clamp:1;font-size:13px}
.row .domain{display:block;margin-top:2px}
.row .tag-dead{color:#b33;font-weight:700}
.row .acts{display:flex;position:relative;z-index:1}
.more{display:block;margin:18px auto 0;min-height:48px;padding:0 26px;border:1px solid var(--line2);border-radius:99px;background:var(--paper);font-weight:700;color:var(--teal-ink)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--radius)}
.archive{color:var(--teal-ink);text-decoration:underline;text-underline-offset:3px;font-size:12px;position:relative;z-index:1}
.hidden-note{margin-top:22px;color:var(--muted);font-size:13px;text-align:center}
.hidden-note button{border:0;background:none;color:var(--teal-ink);text-decoration:underline;text-underline-offset:3px;min-height:44px;font-size:13px}

/* note + footer */
.note{margin-top:46px;padding:20px 22px;border-radius:var(--radius);background:var(--teal-soft);color:var(--muted);font-size:13.5px;line-height:1.8}
.note strong{color:var(--ink);display:block;margin-bottom:4px;font-size:14px}
.footer{text-align:center;color:var(--soft);font-size:11px;letter-spacing:.12em;margin-top:28px}

/* back to top */
.to-top{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(20px + var(--safe-b));z-index:40;width:50px;height:50px;border-radius:50%;border:1px solid var(--line2);background:var(--paper);box-shadow:var(--shadow);font-size:20px;color:var(--teal-ink);opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .25s,transform .25s,visibility .25s}
.to-top.show{opacity:1;visibility:visible;transform:none}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translate(-50%,16px);z-index:50;background:#163a36;color:#eaf6f2;border-radius:12px;padding:11px 16px;font-size:13.5px;opacity:0;visibility:hidden;transition:.25s;max-width:90vw}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
 <a class="brand" href="index.html">KNOWLEDGE MUSEUM<small>THE CURATED ATLAS</small></a>
 <div class="top-controls">
  <nav class="language-switch" aria-label="Language / 语言"><button data-lang="zh-CN" type="button">简</button><button data-lang="zh-TW" type="button">繁</button><button data-lang="en" type="button">EN</button></nav>
  <span data-theme-mount></span>
  <a class="pill-btn" href="index.html"><span aria-hidden="true">←</span> <span class="back-label" data-t="back">博物馆</span></a>
 </div>
</header>

<section class="intro">
 <div>
  <div class="kicker">Knowledge Atlas</div>
  <h1><span data-t="heroA">好奇心的</span><span data-t="heroB">无限坐标</span></h1>
  <p id="introText"></p>
 </div>
 <svg class="orbit" viewBox="0 0 480 480" aria-hidden="true"><defs><linearGradient id="og" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#20bba5"/><stop offset="1" stop-color="#1778b4"/></linearGradient></defs><circle cx="240" cy="240" r="193" fill="#e4f3ee"/><circle cx="240" cy="240" r="140" fill="#faf4e9"/><g class="ring"><circle cx="240" cy="240" r="187" fill="none" stroke="#6ac5ae" stroke-width="3" stroke-dasharray="4 16"/><circle cx="53" cy="240" r="20" fill="#0eaaa2"/><circle cx="427" cy="240" r="13" fill="#ecaa66"/><circle cx="240" cy="53" r="15" fill="#9483ce"/><circle cx="240" cy="427" r="17" fill="#ef8c9a"/></g><circle cx="240" cy="240" r="88" fill="url(#og)"/><path d="M200 270l26-64 20 36 17-23 24 51" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
</section>

<div class="bar" id="bar">
 <div class="tabs" role="tablist">
  <button class="tab" role="tab" data-view="feed" data-t="tabFeed">刷一刷</button>
  <button class="tab" role="tab" data-view="dir" data-t="tabDir">分类</button>
  <button class="tab" role="tab" data-view="liked"><span data-t="tabLiked">喜欢</span><b id="likedCount"></b></button>
 </div>
 <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg><input id="q" type="search" enterkeyhint="search" autocomplete="off"><button id="clear" class="clear" type="button" hidden data-t="clear">清除</button></label>
</div>

<main>
 <section id="viewFeed">
  <div class="feed-head">
   <div><h2 data-t="feedTitle">随便逛逛</h2><p id="feedNote"></p></div>
   <div class="feed-tools">
    <select class="select" id="feedScope" aria-label="Scope"></select>
    <button class="pill-btn" id="shuffle" type="button">↻ <span data-t="shuffle">换一批</span></button>
   </div>
  </div>
  <div class="feed" id="feed"></div>
  <div class="sentinel" id="sentinel"></div>
  <div class="end" id="feedEnd" hidden></div>
 </section>

 <section id="viewDir" hidden>
  <div class="dir-head"><div><h2 id="dirTitle"></h2><p id="dirCount"></p></div>
   <select class="select" id="sort" aria-label="Sort"></select></div>
  <div class="chips" id="cats"></div>
  <div class="chips sub" id="subs"></div>
  <div class="list" id="list"></div>
  <button class="more" id="more" type="button" hidden></button>
 </section>

 <section id="viewLiked" hidden>
  <div class="dir-head"><div><h2 data-t="likedTitle">喜欢的网站</h2><p id="likedNote"></p></div></div>
  <div class="list" id="likedList"></div>
  <div class="hidden-note" id="hiddenNote"></div>
 </section>

 <section class="note"><strong data-t="noteTitle">关于打开方式</strong><span data-t="note"></span></section>
</main>
<div class="footer">KNOWLEDGE MUSEUM · THE KNOWLEDGE ATLAS</div>
</div>
<button class="to-top" id="toTop" type="button" aria-label="Top">↑</button>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {

/* ---------- session state (survives leaving to a site and coming back) ---------- */
let sess = { view: "feed", seed: 0, shown: 12, scope: "", cat: "", sub: "", q: "", sort: "default", dirCount: 40, scroll: 0 };
try { sess = Object.assign(sess, JSON.parse(sessionStorage.getItem(SESSION_KEY) || "{}")); } catch {}
if (!sess.seed) sess.seed = (Math.random() * 2 ** 31) | 0;
const persist = () => { sess.scroll = scrollY; try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(sess)); } catch {} };
addEventListener("pagehide", persist);
document.addEventListener("visibilitychange", () => { if (document.hidden) persist(); });

let all = [], cats = [], catIndex = new Map();

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function tintOf(s) { const i = catIndex.get(s.c) ?? 0; return TINTS[i % TINTS.length]; }
function glyphOf(s) { return GLYPHS[(catIndex.get(s.c) ?? 0) % GLYPHS.length]; }
function matches(s, terms) {
 if (!terms.length) return true;
 const hay = (s.n + " " + (s.o || "") + " " + (s.d || "") + " " + s.c + " " + s.s + " " + L(s.c) + " " + L(s.s) + " " + (CATEGORY_TRANSLATIONS.en[s.c] || "") + " " + (CATEGORY_TRANSLATIONS.en[s.s] || "") + " " + host(s.u)).toLowerCase();
 return terms.every(t => hay.includes(t));
}
const terms = () => sess.q.trim().toLowerCase().split(/\s+/).filter(Boolean);

/* Feed order: weighted random (Efraimidis–Spirakis). Unseen sites, sites with a preview,
   and fields you have liked before come up more often. Hidden and dead sites are left out. */
function feedOrder() {
 const r = rng(sess.seed);
 const likedCats = {};
 for (const id in store.likes) { const s = all.find(x => x.id === id); if (s) likedCats[s.c] = (likedCats[s.c] || 0) + 1; }
 return all
  .filter(s => !store.hidden[s.id] && s.st !== "dead" && (!sess.scope || s.c === sess.scope))
  .map(s => {
   let w = 1;
   if (!store.seen[s.id]) w *= 3;
   if (s.img) w *= 1.6;
   if (s.d) w *= 1.25;
   w *= 1 + Math.min(likedCats[s.c] || 0, 6) * 0.25;
   return { s, k: -Math.log(1 - r()) / w };
  })
  .sort((a, b) => a.k - b.k)
  .map(x => x.s);
}

/* ---------- rendering ---------- */
function thumb(s, cls) {
 const [t1, t2] = tintOf(s);
 const style = `--tint:${t1};--tint2:${t2}`;
 if (cls === "mini") return `<div class="mini" style="${style}">${s.img ? `<img src="${esc(s.img)}" alt="" loading="lazy" decoding="async">` : glyphOf(s)}</div>`;
 const badge = s.st === "dead" ? `<span class="badge dead">${esc(T("dead"))}</span>` : store.seen[s.id] ? `<span class="badge">${esc(T("seen"))}</span>` : "";
 return `<div class="thumb${s.img ? "" : " band"}" style="${style}">${badge}${s.img
   ? `<img src="${esc(s.img)}" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.add('band');this.remove()">`
   : `<div class="ph"><span class="glyph" aria-hidden="true">${glyphOf(s)}</span><span class="dom">${esc(host(s.u))}</span></div>`}</div>`;
}
function desc(s) {
 if (!s.d) return "";
 const ai = s.ds === "ai";
 return `<p class="desc${ai ? " ai" : ""}"${ai ? ` data-ai="${esc(T("ai"))}"` : ""}>${esc(s.d)}</p>`;
}
const archiveUrl = s => "https://web.archive.org/web/2024/" + s.u;
function likeBtn(s) { const on = !!store.likes[s.id]; return `<button class="icon${on ? " liked" : ""}" type="button" data-like="${esc(s.id)}" aria-pressed="${on}" aria-label="${esc(T(on ? "unlike" : "like"))}" title="${esc(T(on ? "unlike" : "like"))}">${on ? "♥" : "♡"}</button>`; }
function card(s) {
 return `<article class="card${store.seen[s.id] ? " is-seen" : ""}" data-id="${esc(s.id)}">
  ${thumb(s)}
  <div class="body">
   <div class="meta">${esc(L(s.c))} · ${esc(L(s.s))}</div>
   <h3><a href="${esc(safe(s.u))}" target="_blank" rel="noopener noreferrer" data-open="${esc(s.id)}" title="${esc(s.o || s.n)}">${esc(s.n)}</a></h3>
   ${desc(s)}
  </div>
  <div class="foot"><span class="domain">${esc(host(s.u))}</span>${likeBtn(s)}<button class="icon" type="button" data-hide="${esc(s.id)}" aria-label="${esc(T("hide"))}" title="${esc(T("hide"))}">⊘</button></div>
 </article>`;
}
function row(s) {
 const dead = s.st === "dead";
 return `<article class="row" data-id="${esc(s.id)}">
  ${thumb(s, "mini")}
  <div style="min-width:0">
   <h3><a href="${esc(safe(s.u))}" target="_blank" rel="noopener noreferrer" data-open="${esc(s.id)}" title="${esc(s.o || s.n)}">${esc(s.n)}</a></h3>
   ${desc(s)}
   <span class="domain">${dead ? `<span class="tag-dead">${esc(T("dead"))}</span> · <a class="archive" href="${esc(archiveUrl(s))}" target="_blank" rel="noopener">${esc(T("archive"))}</a> · ` : ""}${esc(host(s.u))} · ${esc(L(s.s))}</span>
  </div>
  <div class="acts">${likeBtn(s)}</div>
 </article>`;
}

/* feed: cards go into the shortest column (masonry), in feed order */
let order = [], observer = null, colCount = 0;
const wantCols = () => { const w = $("feed").clientWidth || innerWidth; return w < 620 ? 1 : w < 980 ? 2 : 3; };
function placeCards(nodes) {
 const cols = [...$("feed").children];
 for (const n of nodes) {
  let best = cols[0];
  for (const c of cols) if (c.offsetHeight < best.offsetHeight - 1) best = c;
  best.appendChild(n);
 }
}
function cardNodes(list) { const t = document.createElement("template"); t.innerHTML = list.map(card).join(""); return [...t.content.children]; }
function setCols(n) {
 const old = [...document.querySelectorAll("#feed .card")].sort((a, b) => a.dataset.i - b.dataset.i);
 colCount = n;
 $("feed").innerHTML = Array.from({ length: n }, () => '<div class="col"></div>').join("");
 placeCards(old);
}
function renderFeed(keep) {
 order = feedOrder();
 if (!keep) sess.shown = 12;
 $("feedNote").textContent = T("feedNote");
 setCols(wantCols());
 const nodes = cardNodes(order.slice(0, sess.shown));
 nodes.forEach((n, i) => n.dataset.i = i);
 placeCards(nodes);
 if (!order.length) $("feed").innerHTML = `<div class="empty" style="flex:1">${esc(T("noResult"))}</div>`;
 updateFeedEnd();
}
function moreFeed() {
 if (sess.shown >= order.length) return;
 const from = sess.shown;
 sess.shown = Math.min(order.length, sess.shown + 12);
 const nodes = cardNodes(order.slice(from, sess.shown));
 nodes.forEach((n, i) => n.dataset.i = from + i);
 placeCards(nodes);
 updateFeedEnd();
}
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (sess.view === "feed" && wantCols() !== colCount) setCols(wantCols()); }, 150); });
function updateFeedEnd() {
 const end = $("feedEnd");
 end.hidden = sess.shown < order.length;
 end.innerHTML = `${esc(T("endFeed"))}<br><button class="pill-btn" type="button" id="again">↻ ${esc(T("again"))}</button>`;
 const again = $("again"); if (again) again.onclick = reshuffle;
}
function reshuffle() { sess.seed = (Math.random() * 2 ** 31) | 0; renderFeed(); scrollTo({ top: $("bar").offsetTop - 4, behavior: "smooth" }); persist(); }

/* directory */
function renderDir() {
 const ts = terms();
 $("cats").innerHTML = `<button class="chip${sess.cat ? "" : " active"}" data-cat="">${esc(T("allFields"))}<small>${all.length}</small></button>` +
  cats.map(c => `<button class="chip${sess.cat === c.name ? " active" : ""}" data-cat="${esc(c.name)}">${esc(L(c.name))}<small>${c.n}</small></button>`).join("");
 const scope = all.filter(s => !sess.cat || s.c === sess.cat);
 const subs = [...scope.reduce((m, s) => m.set(s.s, (m.get(s.s) || 0) + 1), new Map())].sort((a, b) => b[1] - a[1]);
 const subsEl = $("subs");
 subsEl.hidden = !sess.cat || subs.length < 2;
 subsEl.innerHTML = `<button class="chip${sess.sub ? "" : " active"}" data-sub="">${esc(T("allTopics"))}</button>` +
  subs.map(([n, k]) => `<button class="chip${sess.sub === n ? " active" : ""}" data-sub="${esc(n)}">${esc(L(n))}<small>${k}</small></button>`).join("");
 let data = scope.filter(s => (!sess.sub || s.s === sess.sub) && matches(s, ts));
 if (sess.sort === "name") data.sort((a, b) => a.n.localeCompare(b.n, lang === "en" ? "en" : "zh"));
 else if (sess.sort === "random") { const r = rng(sess.seed + 7); data = data.map(s => [r(), s]).sort((a, b) => a[0] - b[0]).map(x => x[1]); }
 $("dirTitle").textContent = sess.cat ? L(sess.cat) : T("allSites");
 $("dirCount").textContent = T("found", { n: data.length });
 $("list").innerHTML = data.slice(0, sess.dirCount).map(row).join("") || `<div class="empty">${esc(T("noResult"))}</div>`;
 const left = data.length - sess.dirCount;
 $("more").hidden = left <= 0;
 $("more").textContent = T("more", { n: Math.min(40, left) });
}

/* liked */
function renderLiked() {
 const liked = all.filter(s => store.likes[s.id]).sort((a, b) => store.likes[b.id] - store.likes[a.id]);
 $("likedNote").textContent = T("likedNote");
 $("likedList").innerHTML = liked.map(row).join("") || `<div class="empty">${esc(T("likedEmpty"))}</div>`;
 const nh = Object.keys(store.hidden).length;
 $("hiddenNote").innerHTML = nh ? `${esc(T("hiddenNote", { n: nh }))} · <button type="button" id="restoreAll">${esc(T("restore"))}</button>` : "";
 const rb = $("restoreAll"); if (rb) rb.onclick = () => { store.hidden = {}; save(); toast(T("restored")); renderLiked(); };
}
function updateLikedCount() { const n = Object.keys(store.likes).length; $("likedCount").textContent = n ? n : ""; }

/* views */
function setView(v, opts) {
 sess.view = v;
 document.querySelectorAll(".tab").forEach(b => { const on = b.dataset.view === v; b.classList.toggle("active", on); b.setAttribute("aria-selected", on); });
 $("viewFeed").hidden = v !== "feed"; $("viewDir").hidden = v !== "dir"; $("viewLiked").hidden = v !== "liked";
 if (v === "feed") renderFeed(opts && opts.keep);
 if (v === "dir") renderDir();
 if (v === "liked") renderLiked();
 persist();
}

/* chrome text */
function translate() {
 document.documentElement.lang = lang;
 document.title = (lang === "en" ? "Knowledge Atlas" : lang === "zh-TW" ? "知識座標" : "知识坐标") + " · Knowledge Museum";
 document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T(el.dataset.t); });
 $("q").placeholder = T("search"); $("q").setAttribute("aria-label", T("search"));
 $("introText").textContent = T("intro", { n: all.length || "—", c: cats.length || "—" });
 $("feedScope").innerHTML = `<option value="">${esc(T("allFields"))}</option>` + cats.map(c => `<option value="${esc(c.name)}"${sess.scope === c.name ? " selected" : ""}>${esc(L(c.name))} (${c.n})</option>`).join("");
 $("sort").innerHTML = ["default", "name", "random"].map(k => `<option value="${k}"${sess.sort === k ? " selected" : ""}>${esc(T("sort" + k[0].toUpperCase() + k.slice(1)))}</option>`).join("");
 $("toTop").setAttribute("aria-label", T("back"));
 document.querySelectorAll(".language-switch button").forEach(b => { const on = b.dataset.lang === lang; b.classList.toggle("active", on); b.setAttribute("aria-pressed", on); });
}
function setLang(l) {
 if (!DICT[l] || l === lang) return;
 lang = l; try { localStorage.setItem(LANG_KEY, l); } catch {}
 const y = scrollY; translate(); setView(sess.view, { keep: true }); scrollTo(0, y);
}

let toastTimer;
function toast(msg, action) {
 const el = $("toast");
 el.innerHTML = esc(msg) + (action ? ` <button class="undo" type="button" id="toastAct">${esc(action.label)}</button>` : "");
 el.classList.add("show");
 if (action) $("toastAct").onclick = () => { el.classList.remove("show"); action.run(); };
 clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 4000);
}

/* ---------- events ---------- */
document.querySelectorAll(".language-switch button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { setView(b.dataset.view); const top = $("bar").offsetTop - 4; if (scrollY > top) scrollTo({ top }); }));
$("shuffle").addEventListener("click", reshuffle);
$("feedScope").addEventListener("change", e => { sess.scope = e.target.value; renderFeed(); persist(); });
$("sort").addEventListener("change", e => { sess.sort = e.target.value; sess.dirCount = 40; renderDir(); persist(); });
$("more").addEventListener("click", () => { sess.dirCount += 40; renderDir(); persist(); });
$("cats").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (!b) return; sess.cat = b.dataset.cat; sess.sub = ""; sess.dirCount = 40; renderDir(); persist(); });
$("subs").addEventListener("click", e => { const b = e.target.closest("[data-sub]"); if (!b) return; sess.sub = b.dataset.sub; sess.dirCount = 40; renderDir(); persist(); });
let qTimer;
$("q").value = sess.q;
$("clear").hidden = !sess.q;
$("q").addEventListener("input", e => {
 clearTimeout(qTimer);
 qTimer = setTimeout(() => {
  sess.q = e.target.value; sess.dirCount = 40; $("clear").hidden = !sess.q;
  if (sess.q && sess.view !== "dir") { sess.cat = ""; sess.sub = ""; setView("dir"); } else renderDir();
  persist();
 }, 160);
});
$("clear").addEventListener("click", () => { sess.q = ""; $("q").value = ""; $("clear").hidden = true; renderDir(); persist(); $("q").focus(); });

document.addEventListener("click", e => {
 const like = e.target.closest("[data-like]");
 if (like) {
  const id = like.dataset.like;
  if (store.likes[id]) delete store.likes[id]; else store.likes[id] = Date.now();
  save(); updateLikedCount();
  document.querySelectorAll(`[data-like="${CSS.escape(id)}"]`).forEach(b => { const s = all.find(x => x.id === id); b.outerHTML = likeBtn(s); });
  if (sess.view === "liked") renderLiked();
  return;
 }
 const hide = e.target.closest("[data-hide]");
 if (hide) {
  const id = hide.dataset.hide, el = hide.closest(".card"), html = el.outerHTML.replace('<article class="card', `<article data-i="${el.dataset.i}" class="card`);
  store.hidden[id] = Date.now(); save();
  el.className = "card gone"; el.innerHTML = `<span>${esc(T("hidden"))}</span><button class="undo" type="button">${esc(T("undo"))}</button>`;
  el.querySelector(".undo").onclick = () => { delete store.hidden[id]; save(); el.outerHTML = html; };
  return;
 }
 const open = e.target.closest("[data-open]");
 if (open) {
  store.seen[open.dataset.open] = Date.now(); save(); persist();
  const c = open.closest(".card"); if (c) setTimeout(() => c.classList.add("is-seen"), 400);
 }
});

const bar = $("bar");
addEventListener("scroll", () => {
 $("toTop").classList.toggle("show", scrollY > 300);
 bar.classList.toggle("stuck", bar.getBoundingClientRect().top <= 0 && scrollY > 10);
}, { passive: true });
$("toTop").addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));

/* ---------- load ---------- */
fetch("data/yellow-pages.json", { cache: "no-cache" })
 .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
 .then(data => {
  all = (data.sites || []).filter(s => /^https?:\/\//i.test(s.u)).map(s => Object.assign(s, { id: String(s.id) }));
  const counts = all.reduce((m, s) => m.set(s.c, (m.get(s.c) || 0) + 1), new Map());
  cats = [...counts].map(([name, n]) => ({ name, n })).sort((a, b) => b.n - a.n);
  cats.forEach((c, i) => catIndex.set(c.name, i));
  if (sess.scope && !counts.has(sess.scope)) sess.scope = "";
  if (sess.cat && !counts.has(sess.cat)) { sess.cat = ""; sess.sub = ""; }
  translate(); updateLikedCount();
  const y = sess.scroll;
  setView(sess.view || "feed", { keep: true });
  if (y) requestAnimationFrame(() => scrollTo(0, y));
  observer = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting) && sess.view === "feed") moreFeed(); }, { rootMargin: "600px 0px" });
  observer.observe($("sentinel"));
 })
 .catch(err => { console.error(err); translate(); $("feed").innerHTML = `<div class="empty">${esc(T("loadFail"))}</div>`; });
translate();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
})();
</script>
</body>
</html>
