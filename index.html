<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Knowledge Museum">
  <title>Knowledge Museum</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/app-icon-1024.png">
  <link rel="apple-touch-startup-image" href="assets/splash/startup-image.png">
  <link rel="icon" type="image/png" href="assets/icons/app-icon-1024.png">
  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    #app-splash{
      position:fixed;
      inset:0;
      z-index:99999;
      display:grid;
      place-items:center;
      background:#f7f3ea url('assets/splash/background.png') center/cover no-repeat;
      opacity:1;
      visibility:visible;
      transition:opacity .38s ease,visibility .38s ease;
    }
    #app-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
    #app-splash img{
      display:block;
      width:min(72vw,430px);
      max-height:72vh;
      object-fit:contain;
    }
    @media (prefers-reduced-motion:reduce){
      #app-splash{transition:none}
    }
  </style>
</head>
<body>
  <div id="app-splash" aria-hidden="true">
    <img src="assets/splash/startup-image.png" alt="">
  </div>

  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html">KNOWLEDGE MUSEUM<small>PERSONAL ARCHIVE</small></a>
      <div class="top-actions"><button class="icon-btn" id="randomBtn">随机漫游 ↗</button></div>
    </header>
    <main>
      <section class="hero">
        <div>
          <div class="kicker">Private digital museum · 私人知识博物馆</div>
          <h1>Things worth<br>remembering.</h1>
          <p>把散落的知识、图解、互动演示和研究笔记收进同一个入口。这里不是文件夹，而是一座会持续生长的私人博物馆。</p>
        </div>
        <div class="museum-mark">M</div>
      </section>

      <section class="section">
        <div class="section-head"><h2>Collections</h2><span>按主题探索</span></div>
        <div class="category-grid" id="categoryGrid"></div>
      </section>

      <section class="section" id="collection">
        <div class="section-head"><h2>Exhibits</h2><span class="count" id="resultCount"></span></div>
        <div class="controls">
          <input class="search" id="search" placeholder="搜索标题、标签或关键词…">
          <button class="chip active" data-filter="all">全部</button>
          <button class="chip" data-filter="history">历史</button>
          <button class="chip" data-filter="science">科学</button>
          <button class="chip" data-filter="nature">自然</button>
          <button class="chip" data-filter="finance">金融</button>
        </div>
        <div class="article-list" id="articleList"></div>
      </section>
    </main>
    <footer>KNOWLEDGE MUSEUM · Curated by you · GitHub Pages ready</footer>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    (() => {
      const splash = document.getElementById('app-splash');
      const hide = () => {
        if (!splash) return;
        splash.classList.add('is-hidden');
        window.setTimeout(() => splash.remove(), 450);
      };
      const alreadyShown = sessionStorage.getItem('km-splash-shown');
      if (alreadyShown) {
        splash?.remove();
      } else {
        sessionStorage.setItem('km-splash-shown','1');
        window.addEventListener('load', () => window.setTimeout(hide, 650), {once:true});
        window.setTimeout(hide, 1800);
      }
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
