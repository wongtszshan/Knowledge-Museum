<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Knowledge Museum · Viewer</title><link rel="stylesheet" href="assets/css/app.css?v=20261116-museum-i18n"><script defer src="assets/js/i18n.js?v=20261116-1"></script></head><body class="viewer-body"><div class="viewer-bar"><div class="viewer-left"><button class="viewer-btn" onclick="history.length>1?history.back():location.href='index.html'" data-i18n="previous">← 上一页</button><a class="viewer-btn" href="index.html" data-i18n="museum">⌂ 知识博物馆</a></div><div class="viewer-title" id="viewerTitle">Loading…</div><div class="viewer-right"><a class="viewer-btn" id="openRaw" target="_blank" rel="noopener" data-i18n="fullscreen">全屏打开 ↗</a></div></div><iframe class="viewer-frame" id="frame" title="Knowledge exhibit"></iframe><script>(async()=>{const id=new URLSearchParams(location.search).get('id');try{const r=await fetch('data/articles.json',{cache:'no-store'});const arr=await r.json();const a=arr.find(x=>x.id===id);if(!a)throw 0;document.title=`${a.title} · Knowledge Museum`;document.getElementById('viewerTitle').textContent=a.title;const src=`content/html/${a.file}`;document.getElementById('frame').src=src;document.getElementById('openRaw').href=src}catch(e){document.getElementById('viewerTitle').textContent=KM_I18N.t('exhibitMissing');document.getElementById('frame').style.display='none';document.getElementById('openRaw').style.display='none'}})();</script></body></html>
