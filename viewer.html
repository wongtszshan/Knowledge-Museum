<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172721">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Knowledge Museum">
  <title>Knowledge Museum · Viewer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/theme.js"></script>
</head>
<body class="reader-body viewer-body" data-reader="html">
  <header class="reader-bar" id="readerBar">
    <div class="reader-left">
      <button class="reader-btn icon-only" id="backBtn" type="button" data-i18n-aria="back" aria-label="返回">←</button>
      <a class="reader-btn icon-only" href="index.html" data-i18n-aria="museum" aria-label="知识博物馆">⌂</a>
    </div>
    <div class="reader-heading">
      <a class="reader-kicker" id="readerCat" href="archive.html"></a>
      <div class="reader-title" id="readerTitle" data-i18n="loading">正在载入…</div>
    </div>
    <div class="reader-right">
      <button class="reader-btn icon-only" id="favBtn" type="button" aria-pressed="false" data-i18n-aria="favorite" aria-label="收藏">☆</button>
      <button class="reader-btn wide-only" id="shareBtn" type="button" data-i18n="share">分享</button>
      <a class="reader-btn wide-only" id="openRaw" target="_blank" rel="noopener" data-i18n="fullscreen">全屏打开 ↗</a>
      <button class="reader-btn" id="moreBtn" type="button" aria-expanded="false" aria-controls="readerDrawer"><span aria-hidden="true">☰</span> <span data-i18n="more">更多</span></button>
    </div>
  </header>
  <div class="reader-progress" aria-hidden="true"><i id="progressBar"></i></div>
  <main class="reader-stage">
    <iframe class="reader-frame" id="frame" title="Knowledge exhibit"></iframe>
  </main>

  <div class="reader-drawer" id="readerDrawer" aria-hidden="true">
    <button class="reader-drawer-backdrop" id="drawerBackdrop" type="button" tabindex="-1" data-i18n-aria="close" aria-label="关闭"></button>
    <section class="reader-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer-head">
        <div><div class="kicker" id="drawerKicker">Exhibit</div><h2 id="drawerTitle"></h2></div>
        <button class="collections-close" id="drawerClose" type="button" data-i18n-aria="close" aria-label="关闭">×</button>
      </div>
      <div class="drawer-actions">
        <button class="drawer-action" id="drawerFav" type="button"></button>
        <button class="drawer-action" id="drawerDone" type="button"></button>
        <button class="drawer-action" id="drawerShare" type="button" data-i18n="share">分享</button>
        <a class="drawer-action" id="drawerRaw" target="_blank" rel="noopener" data-i18n="fullscreen">全屏打开 ↗</a>
      </div>
      <div class="drawer-block">
        <h3><span data-i18n="inThisHall">本展厅</span> · <a id="drawerCat" href="archive.html"></a></h3>
        <div class="drawer-nav" id="drawerNav"></div>
      </div>
      <div class="drawer-block">
        <h3 data-i18n="related">相关展品</h3>
        <div class="drawer-related" id="drawerRelated"></div>
      </div>
      <div class="drawer-block">
        <h3 data-i18n="appearance">外观与语言</h3>
        <div class="drawer-prefs"><div data-lang-mount></div><div data-theme-mount></div></div>
      </div>
    </section>
  </div>

  <script defer src="assets/js/i18n.js"></script>
  <script defer src="assets/js/core.js"></script>
  <script defer src="assets/js/reader.js"></script>
</body>
</html>
